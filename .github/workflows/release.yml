name: Package WordPress theme release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and build installable theme
        run: python3 tools/package.py "$GITHUB_REF_NAME"
      - name: Publish packaged release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/asfar.zip dist/asfar-media.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/asfar.zip dist/asfar-media.zip --title "ASFAR $GITHUB_REF_NAME" --generate-notes
          fi
